{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "omp-agent.serviceAccountName" . }}
  labels:
    {{- include "omp-agent.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
# The agent runs arbitrary shell; it gets no Kubernetes API credentials.
automountServiceAccountToken: false
{{- end }}
